[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swadb"
version = "0.1.1"
description = "Sovereign agent memory system: tiered knowledge, knowledge graph, MCP-native, multi-agent."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "George Sultani", email = "george@sultani.co" }]
keywords = ["llm", "agent", "memory", "rag", "knowledge-graph", "mcp", "sqlite", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
encryption = ["sqlcipher3>=0.5.0"]
ann = ["hnswlib>=0.8.0"]
all = ["sqlcipher3>=0.5.0", "hnswlib>=0.8.0"]
dev = ["pytest>=8.0", "build>=1.0", "twine>=5.0"]

[project.scripts]
swadb = "swadb.cli:main"

[project.urls]
Homepage = "https://github.com/gsultani1/AgentDB"
Repository = "https://github.com/gsultani1/AgentDB"
Issues = "https://github.com/gsultani1/AgentDB/issues"

[tool.setuptools.packages.find]
include = ["swadb*"]
exclude = ["tests*", "src-tauri*", "uploads*"]

[tool.setuptools.package-data]
swadb = ["static/**/*", "static/**/.*"]
