name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a rapid push doesn't pile up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.10 is the floor in pyproject.toml (mcp has no releases for <3.10)
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install hnswlib (portable build)
        # hnswlib ships no binary wheels and its sdist compiles with
        # -march=native on unix. GitHub's runner fleet has heterogeneous
        # CPUs and the pip cache is shared across them, so a wheel built
        # on one runner can die with SIGILL (exit 132) on the next.
        # HNSWLIB_NO_NATIVE drops -march=native; --no-cache-dir refuses
        # any previously cached non-portable wheel.
        run: pip install --no-cache-dir "hnswlib>=0.8.0"
        env:
          HNSWLIB_NO_NATIVE: "1"

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        # Note: the `encryption` extra needs a system sqlcipher dev library,
        # which adds friction across platforms. Encryption tests are auto-
        # skipped via conftest.pytest_collection_modifyitems when sqlcipher3
        # isn't importable, so they cleanly opt out of CI by default.

      - name: Run fast tests
        run: pytest tests/ -v -m "not slow" --tb=short

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify static assets included in wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -E "static/(index\.html|css/main\.css|js/app\.js)"
          test -f dist/swadb-*.tar.gz
          test -f dist/swadb-*-py3-none-any.whl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
