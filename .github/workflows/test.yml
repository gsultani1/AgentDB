name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a rapid push doesn't pile up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # 3.9 is the floor in pyproject.toml; smoke-test it on Linux only to
        # keep the matrix tractable
        include:
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ann]"
        # Note: the `encryption` extra needs a system sqlcipher dev library,
        # which adds friction across platforms. Encryption tests are auto-
        # skipped via conftest.pytest_collection_modifyitems when sqlcipher3
        # isn't importable, so they cleanly opt out of CI by default.

      - name: Run fast tests
        run: pytest tests/ -v -m "not slow" --tb=short

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify static assets included in wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -E "static/(index\.html|css/main\.css|js/app\.js)"
          test -f dist/swadb-*.tar.gz
          test -f dist/swadb-*-py3-none-any.whl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
