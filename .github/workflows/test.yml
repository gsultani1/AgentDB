name: Test

# Fast test matrix + packaging verification on every push/PR to main.
# The build job runs in parallel with pytest (no needs:) so packaging
# feedback is not serialized behind the whole matrix; branch protection
# can still require both. Slow tests run weekly in slow-tests.yml.
#
# NOTE on action pinning: tags (@v5 etc.) are mutable; pinning by commit
# SHA is the hardened form. SHAs could not be resolved from the sandbox
# that authored this file — migrate to SHA pins from a machine with
# GitHub access; Dependabot keeps refs updated but does not migrate
# tags to SHAs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Full Python spread on Ubuntu; min + max on macOS/Windows —
        # preserves most compatibility signal at 8 jobs instead of 12.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      # Portable hnswlib build: -march=native wheels from a shared pip
      # cache SIGILL on runners with a different CPU.
      - name: Install portable hnswlib
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install --no-cache-dir "hnswlib>=0.8.0"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run fast tests
        run: python -m pytest tests/ -v -m "not slow" --tb=short

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Intentionally no `needs: pytest` — packaging validation runs in
    # parallel with the test matrix.
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Verify distribution names and wheel contents
        shell: python
        run: |
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/swadb-*-py3-none-any.whl")
          sdists = glob.glob("dist/swadb-*.tar.gz")

          if len(wheels) != 1:
              sys.exit(f"Expected exactly one universal wheel; found: {wheels}")
          if len(sdists) != 1:
              sys.exit(f"Expected exactly one sdist; found: {sdists}")

          required = {
              "static/index.html",
              "static/css/main.css",
              "static/js/app.js",
          }

          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())

          missing = {
              asset for asset in required
              if not any(name.endswith(asset) for name in names)
          }

          if missing:
              sys.exit(f"Wheel is missing required assets: {sorted(missing)}")

      # Closes the gap between "the source tests pass" and "the artifact
      # uploaded to PyPI actually works": editable installs mask missing
      # modules/assets/metadata in the wheel.
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install --upgrade pip
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python -c "import swadb; print(swadb.__version__)"
          wheel-test/bin/python -m pip check

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
