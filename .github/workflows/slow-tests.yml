name: Slow tests

# Weekly exercise of the tests test.yml deliberately skips (-m slow: the
# HTTP-endpoint integration suite and other long-running cases), plus a
# manual trigger. Separate file so the schedule never re-runs the
# ordinary matrix and the ordinary events never pay for the slow suite.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slow-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow:
    name: pytest -m slow (Python 3.12 on Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      # Same portable hnswlib recipe as test.yml — a cached -march=native
      # wheel would SIGILL on a runner with a different CPU.
      - name: Install portable hnswlib
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: python -m pip install --no-cache-dir "hnswlib>=0.8.0"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run slow tests
        run: python -m pytest tests/ -v -m "slow" --tb=short
