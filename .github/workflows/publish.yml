name: Publish to PyPI

# Triggered by pushing a tag like v0.3.0. Full trimmed test matrix and
# an independently verified wheel both gate publishing; the GitHub
# Release is created from the exact artifacts that went to PyPI.
#
# Trusted publishing (OIDC) — no API tokens. One-time PyPI setup:
#   https://pypi.org/manage/account/publishing/ → pending publisher
#   Owner gsultani1 / Repository AgentDB / Workflow publish.yml /
#   Environment pypi / Project swadb. The PyPA action also produces
#   PyPI attestations automatically under OIDC.
#
# NOTE on action pinning: tags (@v5 etc.) are mutable; pinning by commit
# SHA is the hardened form. SHAs could not be resolved from the sandbox
# that authored this file — migrate to SHA pins from a machine with
# GitHub access; Dependabot keeps refs updated but does not migrate
# tags to SHAs.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Same trimmed spread as test.yml: full Pythons on Ubuntu,
        # min + max on macOS/Windows.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test environment
        shell: bash
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "hnswlib>=0.8.0"
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v -m "not slow" --tb=short

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Validated in Python (tomllib), not shell regex. The tag pattern is
      # strict X.Y.Z — this project does not publish prereleases; switch to
      # packaging.version.Version if that ever changes.
      - name: Verify release version
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              sys.exit(f"Invalid release tag (want vX.Y.Z, no prereleases): {tag!r}")

          tag_version = tag.removeprefix("v")

          with open("pyproject.toml", "rb") as file:
              package_version = tomllib.load(file)["project"]["version"]

          init_file = pathlib.Path("swadb/__init__.py")
          match = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']',
              init_file.read_text(encoding="utf-8"),
              re.MULTILINE,
          )
          if not match:
              sys.exit(f"Could not find __version__ in {init_file}")
          module_version = match.group(1)

          print(f"Tag:     {tag_version}")
          print(f"Package: {package_version}")
          print(f"Module:  {module_version}")

          if len({tag_version, package_version, module_version}) != 1:
              sys.exit("Tag, project version, and module version do not match")

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      # The wheel that ships must import — editable-install tests can pass
      # while the wheel is missing modules, assets, or metadata.
      - name: Smoke-test wheel
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install --upgrade pip
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python -c "import swadb; print(swadb.__version__)"
          wheel-test/bin/python -m pip check

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, build]
    environment:
      name: pypi
      url: https://pypi.org/p/swadb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with:` block — OIDC trusted publishing, no token needed.

  github_release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
