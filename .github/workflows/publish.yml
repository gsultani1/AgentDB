name: Publish to PyPI

# Triggered by pushing a tag like v0.1.0, v0.2.0, v1.0.0 etc.
# Run pytest first; only publish if tests pass.
#
# Setup required ONCE on PyPI before this works:
#
#   1. Create a PyPI account, or sign into the existing one.
#   2. Go to https://pypi.org/manage/account/publishing/ and add a
#      "Pending publisher" with these values:
#        Owner:           gsultani1
#        Repository:      AgentDB
#        Workflow name:   publish.yml
#        Environment:     pypi
#        Project name:    swadb
#   3. After the first successful publish, the publisher becomes
#      permanent. No API tokens to rotate.
#
# Trusted publishing (OIDC) is preferred over API tokens — no secret
# stored in the repo, no rotation, and PyPI verifies the workflow file
# path matches the registered publisher before accepting an upload.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    name: pytest (Python 3.12 on Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ann]"
      - run: pytest tests/ -v -m "not slow" --tb=short

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python -c "import re,pathlib; m=re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M); print(m.group(1))")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "pyproject.toml version: $PKG_VERSION"
          echo "git tag version:        $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/swadb
    permissions:
      id-token: write    # needed for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with:` block — uses OIDC trusted publishing, no token needed.
        # The pending-publisher entry on PyPI must be configured first.

  github_release:
    name: Attach distributions to GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create or update GitHub Release with the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
