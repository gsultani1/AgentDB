name: Build sidecar binaries

# Per-OS self-contained PyInstaller bundles, attached to the GitHub
# Release for the pushed tag. PyInstaller does not cross-compile, hence
# the matrix. workflow_dispatch allows dry runs (artifacts only, no
# release upload unless release_tag is given or the ref is a tag).
#
# NOTE on action pinning: tags (@v5 etc.) are mutable; pinning by commit
# SHA is the hardened form. SHAs could not be resolved from the sandbox
# that authored this file — migrate to SHA pins from a machine with
# GitHub access; Dependabot (.github/dependabot.yml) keeps whatever ref
# style exists up to date but does not migrate tags to SHAs.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing release tag (e.g. v0.3.0) to attach the built sidecar
          archives to. Leave empty for a build-only dry run.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sidecar-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-sidecar:
    name: sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-15-intel, windows-2022]
        # ubuntu-22.04: oldest-glibc compatibility; macos-14 = arm64.
        # macos-15-intel = mac x64 (the retired macos-13 label queues
        # forever) — it builds against the pinned legacy ML stack in
        # sidecar/constraints-macos-x86_64.txt because PyTorch stopped
        # shipping Intel-Mac wheels after 2.2.2. If GitHub retires
        # macos-15-intel too, drop mac x64 and ship arm64-only.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # Portable hnswlib build — same recipe as test.yml (-march=native
      # wheels from a shared cache SIGILL on runners with different CPUs).
      - name: Install portable hnswlib
        run: python -m pip install --no-cache-dir "hnswlib>=0.8.0"
        env:
          HNSWLIB_NO_NATIVE: "1"

      # CPU-only torch: the default PyPI wheel on Linux bundles the CUDA
      # stack (~2.5 GB of nvidia_* libs) which collect_all("torch") would
      # drag into the bundle, blowing past GitHub's 2 GiB release-asset
      # limit. The sidecar is a CPU embedding server; CUDA is dead weight.
      # Mac wheels are CPU/MPS-only and Windows PyPI wheels are CPU.
      - name: Install CPU-only torch (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + build tooling
        if: matrix.os != 'macos-15-intel'
        run: python -m pip install -e . pyinstaller pyinstaller-hooks-contrib

      - name: Install package + build tooling (Intel-Mac legacy ML stack)
        if: matrix.os == 'macos-15-intel'
        run: >-
          python -m pip install -e . pyinstaller pyinstaller-hooks-contrib
          -c sidecar/constraints-macos-x86_64.txt

      # Fails before PyInstaller with a clear message when the resolved
      # stack is broken (e.g. torch/transformers/numpy incompatibility).
      # Cross-platform: no shell pipelines — Windows defaults to PowerShell.
      - name: Verify ML dependency stack
        run: |
          python -m pip check
          python -c "import numpy, torch, transformers, sentence_transformers; print('numpy:', numpy.__version__); print('torch:', torch.__version__); print('transformers:', transformers.__version__); print('sentence-transformers:', sentence_transformers.__version__)"

      - name: Show installed packages
        run: python -m pip list

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          MOD_VERSION=$(python -c "import swadb; print(swadb.__version__)")
          if [ -n "$RELEASE_TAG" ]; then TAG="$RELEASE_TAG"; else TAG="${GITHUB_REF#refs/tags/}"; fi
          TAG_VERSION="${TAG#v}"
          echo "swadb.__version__: $MOD_VERSION / tag: $TAG_VERSION"
          if [ "$MOD_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match swadb.__version__ ($MOD_VERSION)"
            exit 1
          fi

      - name: Prepare bundled model cache
        run: python sidecar/prepare_hf_cache.py

      - name: Build bundle
        working-directory: sidecar
        run: python -m PyInstaller --clean --noconfirm swadb-sidecar.spec

      - name: Hermetic smoke test
        shell: bash
        working-directory: sidecar
        env:
          # Poison every online/cache path: the bundle must be self-sufficient.
          HF_HUB_OFFLINE: "1"
          HF_HOME: /nonexistent
          TRANSFORMERS_OFFLINE: "1"
          # Force CPU: arm64 macOS runners OOM on their tiny MPS pool.
          SWADB_EMBED_DEVICE: cpu
        run: |
          BIN=dist/swadb-sidecar/swadb
          [ -x "$BIN" ] || BIN=dist/swadb-sidecar/swadb.exe
          test -f dist/swadb-sidecar/_internal/swadb/static/index.html
          test -d dist/swadb-sidecar/_internal/hf-cache/hub
          D=$(mktemp -d)
          "$BIN" --db "$D/t.db" init
          "$BIN" --db "$D/t.db" memory add "hermetic smoke test observation"
          "$BIN" --db "$D/t.db" memory search "hermetic" | grep -qi "smoke"
          "$BIN" --db "$D/t.db" serve --host 127.0.0.1 --port 18420 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:18420/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18420/api/health | grep -q '"status": "ok"'
          kill $SERVER_PID || true

      - name: Archive
        shell: bash
        working-directory: sidecar
        run: |
          VERSION=$(python -c 'import swadb; print(swadb.__version__)')
          case "$RUNNER_OS" in
            Linux)   OS=linux ;;
            macOS)   OS=darwin ;;
            Windows) OS=win32 ;;
          esac
          case "$RUNNER_ARCH" in
            ARM64) ARCH=arm64 ;;
            *)     ARCH=x64 ;;
          esac
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a "../out/swadb-sidecar-v${VERSION}-${OS}-${ARCH}.zip" swadb-sidecar)
          else
            tar -C dist -czf "out/swadb-sidecar-v${VERSION}-${OS}-${ARCH}.tar.gz" swadb-sidecar
          fi
          ls -lh out/
          # GitHub caps release assets at 2 GiB — fail HERE with a readable
          # message (usually means a non-CPU torch snuck into the bundle)
          # instead of a 422 in the release job.
          OVERSIZED=$(find out -type f -size +1900M || true)
          if [ -n "$OVERSIZED" ]; then
            echo "::error::Archive exceeds the 2 GiB release-asset limit (CUDA torch in the bundle?): $OVERSIZED"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-${{ matrix.os }}
          path: sidecar/out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-sidecar
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Create or update GitHub Release with sidecar archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then TAG="$RELEASE_TAG"; else TAG="${GITHUB_REF#refs/tags/}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              out/*
          fi
