name: Build sidecar binaries

# Per-OS self-contained PyInstaller bundles, attached to the GitHub
# Release for the pushed tag. PyInstaller does not cross-compile, hence
# the matrix. workflow_dispatch allows dry runs (artifacts only, no
# release upload unless the ref is a tag).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing release tag (e.g. v0.3.0) to attach the built sidecar
          archives to. Leave empty for a build-only dry run.
        required: false
        type: string

jobs:
  build-sidecar:
    name: sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-15-intel, windows-2022]
        # ubuntu-22.04: oldest-glibc compatibility; macos-14 = arm64.
        # macos-15-intel = mac x64 (the retired macos-13 label queues
        # forever). If GitHub retires macos-15-intel too, drop mac x64
        # and ship arm64-only.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Portable hnswlib build — same recipe as test.yml (-march=native
      # wheels from a shared cache SIGILL on runners with different CPUs).
      - run: pip install --no-cache-dir "hnswlib>=0.8.0"
        env:
          HNSWLIB_NO_NATIVE: "1"
      - run: pip install -e . pyinstaller pyinstaller-hooks-contrib

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          MOD_VERSION=$(python -c "import swadb; print(swadb.__version__)")
          if [ -n "$RELEASE_TAG" ]; then TAG="$RELEASE_TAG"; else TAG="${GITHUB_REF#refs/tags/}"; fi
          TAG_VERSION="${TAG#v}"
          echo "swadb.__version__: $MOD_VERSION / tag: $TAG_VERSION"
          if [ "$MOD_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match swadb.__version__ ($MOD_VERSION)"
            exit 1
          fi

      - name: Prepare bundled model cache
        run: python sidecar/prepare_hf_cache.py

      - name: Build bundle
        working-directory: sidecar
        run: python -m PyInstaller --clean --noconfirm swadb-sidecar.spec

      - name: Hermetic smoke test
        shell: bash
        working-directory: sidecar
        env:
          # Poison every online/cache path: the bundle must be self-sufficient.
          HF_HUB_OFFLINE: "1"
          HF_HOME: /nonexistent
          TRANSFORMERS_OFFLINE: "1"
          # Force CPU: arm64 macOS runners OOM on their tiny MPS pool.
          SWADB_EMBED_DEVICE: cpu
        run: |
          BIN=dist/swadb-sidecar/swadb
          [ -x "$BIN" ] || BIN=dist/swadb-sidecar/swadb.exe
          test -f dist/swadb-sidecar/_internal/swadb/static/index.html
          test -d dist/swadb-sidecar/_internal/hf-cache/hub
          D=$(mktemp -d)
          "$BIN" --db "$D/t.db" init
          "$BIN" --db "$D/t.db" memory add "hermetic smoke test observation"
          "$BIN" --db "$D/t.db" memory search "hermetic" | grep -qi "smoke"
          "$BIN" --db "$D/t.db" serve --host 127.0.0.1 --port 18420 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18420/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18420/api/health | grep -q '"status": "ok"'
          kill $SERVER_PID || true

      - name: Archive
        shell: bash
        working-directory: sidecar
        run: |
          VERSION=$(python -c 'import swadb; print(swadb.__version__)')
          case "$RUNNER_OS" in
            Linux)   OS=linux ;;
            macOS)   OS=darwin ;;
            Windows) OS=win32 ;;
          esac
          case "$RUNNER_ARCH" in
            ARM64) ARCH=arm64 ;;
            *)     ARCH=x64 ;;
          esac
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a "../out/swadb-sidecar-v${VERSION}-${OS}-${ARCH}.zip" swadb-sidecar)
          else
            tar -C dist -czf "out/swadb-sidecar-v${VERSION}-${OS}-${ARCH}.tar.gz" swadb-sidecar
          fi
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.os }}
          path: sidecar/out/*

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    needs: build-sidecar
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create or update GitHub Release with sidecar archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then TAG="$RELEASE_TAG"; else TAG="${GITHUB_REF#refs/tags/}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              out/*
          fi
