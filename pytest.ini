[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Filter the deprecation noise we don't control (sentence-transformers,
# pytorch warmup) so test output stays readable.
filterwarnings =
    ignore::DeprecationWarning:torch.*
    ignore::UserWarning:torch.*
    ignore::FutureWarning:transformers.*

# Most tests are fast unit-level. The few that exercise the embedding
# model or HTTP layer are explicitly marked.
markers =
    slow: tests that load the embedding model or run HTTP servers
    encryption: tests that need sqlcipher3 installed
